# yaml-language-server: $schema=https://raw.githubusercontent.com/hop-top/kit/main/contracts/story-schema.json
schema_version: "1"
story_id: stem.sessions.lineage-continuation-chain
title: Trace how a session was continued across CLIs
binary: stem
intent: |
  A developer looking at one session suspects it was resumed, forked,
  or spawned sub-agents — possibly in a different CLI than the one
  that started it. They resolve the lineage around the session and
  read the tree — ancestors to the root, descendants below, the
  queried session marked — to understand how the work actually flowed.
preconditions:
  - a session id prefix was taken from stem sessions list output
steps:
  - id: lineage
    intent: |
      Render the fork and dispatch chain around the session as a tree,
      root first. The developer follows the fork and dispatch edges to
      find the continuation that holds the later half of the work.
    invoke: ["stem", "sessions", "lineage", "0198f2d4"]
    capture: [exit_code, stdout]
references:
  - title: stem sessions command group spec
    url: https://github.com/hop-top/poly-stem/blob/main/docs/specs/sessions-cli.md

schema_version: "1"
scenario_id: read-only-surface
description: >-
  Previewability holds vacuously and verifiably: the capability
  document declares every leaf a read — zero mutating leaves, zero
  leaves requiring dry-run — so no operation exists whose effects
  would need a preview checkpoint.
binary: stem
factor_coverage: [5, 6]
tier: 3
story_ref:
  story_id: stem.conformance.read-only-surface
  story_path: stories/read-only-surface.yaml
  content_hash: "sha256:c2298b12c280c3a9a59f7e18c88602c8f8a5d7ce0e9ce8e3cd2327975b9aab4c"
steps:
  - id: capabilities_probe
    invoke: ["stem", "capabilities", "--format", "json"]
    capture: [exit_code, stdout, stderr]
assertions:
  - id: capability-surface-present
    kind: output_field_present
    on: capabilities_probe
    factor: 5
    path: "leaves.0.path"
  # F6 scopes preview support to state-changing operations. The
  # surface declares none: the two counts below pin "no leaf mutates"
  # and "no leaf requires dry-run" as measured, falsifiable facts —
  # adding a write leaf without preview support flips this scenario.
  - id: no-mutating-leaves
    kind: output_field_count
    on: capabilities_probe
    factor: 6
    path: 'leaves.#(side_effect!="read")#'
    equals: 0
  - id: no-leaf-requires-preview
    kind: output_field_count
    on: capabilities_probe
    factor: 6
    path: 'leaves.#(dry_run_supported==true)#'
    equals: 0
  - id: surface-declares-idempotent-reads
    kind: output_field_count
    on: capabilities_probe
    factor: 6
    path: 'leaves.#(idempotent!="yes")#'
    equals: 0

schema_version: "1"
scenario_id: contract-surfaces
description: >-
  Declared contracts must hold: the binary serves a machine-readable
  capability listing naming every invocable leaf, honors a pinned
  schema version, and loudly refuses an output format outside the
  declared text|json contract.
binary: stem
factor_coverage: [5, 11]
tier: 3
story_ref:
  story_id: stem.conformance.contract-surfaces
  story_path: stories/contract-surfaces.yaml
  content_hash: "sha256:58051dbcd51d141551830d026a1fe07b2d964865d88397d4af1ada7c518f9a1b"
steps:
  - id: capabilities_probe
    invoke: ["stem", "capabilities", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: api_version_ok
    invoke: ["stem", "sessions", "list", "--api-version", "1.0", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: format_refused
    invoke: ["stem", "sessions", "list", "--format", "xml"]
    capture: [exit_code, stdout, stderr]
assertions:
  - id: capabilities-machine-readable
    kind: capability_roundtrip
    on: capabilities_probe
    factor: 5
    leaves:
      - "stem sessions list"
      - "stem sessions show"
      - "stem sessions search"
      - "stem sessions lineage"
      - "stem capabilities"
  - id: capabilities-exit-zero
    kind: exit_code_equals
    on: capabilities_probe
    factor: 11
    value: 0
  - id: api-version-pin-honored
    kind: exit_code_equals
    on: api_version_ok
    factor: 5
    value: 0
  - id: format-contract-enforced
    kind: stderr_contains
    on: format_refused
    factor: 5
    value: "invalid --format"
  - id: format-refusal-usage-class
    kind: exit_code_class
    on: format_refused
    factor: 11
    classes: [USAGE]

schema_version: "1"
scenario_id: sessions-show-envelope
description: >-
  Single-session read in JSON mode: the crtx v0.1 envelope emitted
  verbatim as one stdout document, turn-level state inspectable as
  typed fields, clean exit.
binary: stem
factor_coverage: [3, 8, 11]
tier: 3
story_ref:
  story_id: stem.conformance.sessions-show-envelope
  story_path: stories/sessions-show-envelope.yaml
  content_hash: "sha256:068433bdaf5ae7d424552f1a92d8d71ea244eee4e8b228614405dde5911d4ca1"
steps:
  - id: show_json
    invoke: ["stem", "sessions", "show", "0198aa00-1111-7abc-8def-123456789abc", "--format", "json"]
    capture: [exit_code, stdout, stderr]
assertions:
  - id: stdout-is-json
    kind: stream_discipline_pass
    on: show_json
    factor: 3
  - id: envelope-schema
    kind: output_schema_matches
    on: show_json
    factor: 3
    schema:
      type: object
      required: [crtx_version, id, source, turns]
      properties:
        crtx_version: { type: string }
        id: { type: string }
        turns:
          type: array
          items:
            type: object
            required: [id, role, content]
  - id: turn-state-inspectable
    kind: output_field_present
    on: show_json
    factor: 8
    path: "turns.0.role"
  - id: envelope-version-inspectable
    kind: output_field_equals
    on: show_json
    factor: 8
    path: "crtx_version"
    value: "0.1"
  - id: exits-zero
    kind: exit_code_equals
    on: show_json
    factor: 11
    value: 0

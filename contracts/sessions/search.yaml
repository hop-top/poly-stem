# stem sessions pack — `stem sessions search --format json` shape.
# Pins docs/specs/sessions-cli.md §3.3. Metadata-scope hits carry
# null turn_index / turn_id / role; content-scope hits populate all
# three.
name: stem-sessions-search-json-0.1
provider: stem
evaluators:
  - name: json_schema_valid
    mode: binary
    schema:
      $defs:
        session_summary:
          type: object
          required:
            - id
            - source
            - created_at
            - updated_at
            - turn_count
            - cwd
            - git_branch
            - title
            - parent_id
            - fork_point
            - dispatched_from
            - store
          properties:
            id: { type: string, minLength: 4 }
            source:
              type: object
              required: [kind, version]
              properties:
                kind: { type: string }
                version: { type: string }
                instance: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            turn_count: { type: integer, minimum: 0 }
            cwd: { type: [string, "null"] }
            git_branch: { type: [string, "null"] }
            title: { type: [string, "null"] }
            parent_id: { type: [string, "null"] }
            fork_point: { type: [integer, "null"] }
            dispatched_from:
              oneOf:
                - type: "null"
                - type: object
                  required: [envelope_id, call_id]
                  properties:
                    envelope_id: { type: string }
                    call_id: { type: string }
            store:
              type: object
              required: [adapter, path]
              properties:
                adapter: { type: string }
                path: { type: string }
      type: object
      required: [query, matches, truncated]
      properties:
        query: { type: string }
        truncated: { type: boolean }
        matches:
          type: array
          items:
            type: object
            required: [session, hits]
            properties:
              session: { $ref: "#/$defs/session_summary" }
              hits:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [scope, turn_index, turn_id, role, snippet]
                  properties:
                    scope: { enum: [content, metadata] }
                    turn_index: { type: [integer, "null"] }
                    turn_id: { type: [string, "null"] }
                    role: { type: [string, "null"] }
                    snippet: { type: string }

[package]
name = "stem-example-web-search"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
hop-top-stem = { path = "../.." }
hop-top-xrr = "0.1.0-alpha.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"

[project]
name = "hop-top-stem"
version = "0.0.0"
description = "Python SDK for stem — crtx v0.1 envelope I/O for AI agent sessions."
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Idea Crafters LLC", email = "lab@ideacrafters.com"},
  {name = "Jad Bitar"},
  {name = "Monaam Benhouria"}
]
keywords = [
  "agent",
  "agent-sessions",
  "agent-runtime",
  "multi-agent",
  "envelope",
  "conversation-history",
  "tool-use",
  "llm",
  "crtx",
  "stem",
  "claude-code",
  "codex",
  "gemini-cli",
  "opencode",
  "openhands",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://hop.top/stem"
Repository = "https://github.com/hop-top/poly-stem"
Documentation = "https://github.com/hop-top/poly-stem/tree/main/py"

[dependency-groups]
# uv sync installs these by default (PEP 735). Keeps `mypy`, `ruff`,
# `pytest` available from a cold clone without `--extra dev`.
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/stem"]

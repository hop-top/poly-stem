[project]
name = "stem-example-web-search"
version = "0.0.0"
description = "stem py SDK example: web_search tool via Anthropic + Tavily + xrr replay."
requires-python = ">=3.12"
dependencies = [
    "hop-top-stem",
    "hop-top-xrr>=0.1.0a4",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.uv.sources]
hop-top-stem = { path = "../..", editable = true }
